name: agentic-os-postgres-poc

services:
  postgres:
    image: postgres:17.6-alpine
    profiles: ["poc"]
    environment:
      POSTGRES_DB: agentic_os_poc
      POSTGRES_USER: agentic_os_poc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private ignored environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - agentic-os-postgres-poc:/var/lib/postgresql/data
      - ./schema-v1.sql:/docker-entrypoint-initdb.d/001-schema-v1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_os_poc -d agentic_os_poc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

volumes:
  agentic-os-postgres-poc:
